<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#63738b"/></marker></defs><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.subtitle{font-size:15px;fill:#566176}.head{font-size:17px;font-weight:700}.body{font-size:13px}.small{font-size:11px;fill:#566176}.card{fill:#fff;stroke:#ccd5e2;stroke-width:1.5}.blue{fill:#eaf2ff;stroke:#7ba5e8}.purple{fill:#f3edff;stroke:#ad91e8}.green{fill:#e8f8ef;stroke:#6ebc8d}.orange{fill:#fff3e5;stroke:#e8ae66}.dark{fill:#e9edf3;stroke:#9aa7b8}.line{stroke:#63738b;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:6 5}</style><rect width="100%" height="100%" fill="#f7f9fc"/><text x="40" y="48" class="title">Production DevSecOps Platform</text><text x="40" y="75" class="subtitle">Application + CI pipeline + AWS infrastructure responsibilities</text><rect x="45" y="125" width="260" height="135" rx="14" class="blue"/><text x="61" y="154" class="head">Source repository</text><text x="61" y="179" class="body">React/Vite frontend</text><text x="61" y="198" class="body">Express API, tests and models</text><text x="61" y="217" class="body">Docker Compose for local run</text><rect x="370" y="125" width="300" height="190" rx="14" class="purple"/><text x="386" y="154" class="head">Jenkins pipeline</text><text x="386" y="179" class="body">Backend: Jest + ESLint</text><text x="386" y="198" class="body">Frontend: Oxlint + Vite build</text><text x="386" y="217" class="body">npm audit report generation</text><text x="386" y="236" class="body">Docker build + Trivy scans</text><rect x="735" y="125" width="280" height="135" rx="14" class="green"/><text x="751" y="154" class="head">Artifact registry</text><text x="751" y="179" class="body">Amazon ECR</text><text x="751" y="198" class="body">Backend + frontend images</text><text x="751" y="217" class="body">Commit SHA and build tags</text><rect x="1080" y="125" width="360" height="165" rx="14" class="orange"/><text x="1096" y="154" class="head">GitOps promotion</text><text x="1096" y="179" class="body">Update values-ecr.yaml</text><text x="1096" y="198" class="body">Validate image values</text><text x="1096" y="217" class="body">Commit and push GitOps change</text><path d="M305,190 L370,190" class="line "/><path d="M670,190 L735,190" class="line "/><path d="M1015,190 L1080,190" class="line "/><rect x="45" y="410" width="420" height="210" rx="14" class="dark"/><text x="61" y="439" class="head">Terraform: network</text><text x="61" y="464" class="body">VPC 10.20.0.0/16</text><text x="61" y="483" class="body">Public/private subnets in two AZs</text><text x="61" y="502" class="body">Internet Gateway, NAT Gateway</text><text x="61" y="521" class="body">Route tables, subnet associations</text><rect x="540" y="410" width="420" height="210" rx="14" class="blue"/><text x="556" y="439" class="head">Terraform: EKS platform</text><text x="556" y="464" class="body">EKS control plane + managed node group</text><text x="556" y="483" class="body">IAM roles, access and cluster policies</text><text x="556" y="502" class="body">EBS CSI role/add-on</text><text x="556" y="521" class="body">ECR repositories and lifecycle policies</text><rect x="1035" y="410" width="405" height="210" rx="14" class="purple"/><text x="1051" y="439" class="head">Terraform: add-ons root</text><text x="1051" y="464" class="body">AWS Load Balancer Controller Helm release</text><text x="1051" y="483" class="body">Uses an existing reachable EKS cluster</text><text x="1051" y="502" class="body">IAM role association for controller</text><text x="1051" y="521" class="body">Separate from the dev infrastructure root</text><path d="M465,515 L540,515" class="line "/><path d="M960,515 L1035,515" class="line "/><rect x="45" y="700" width="420" height="150" rx="14" class="green"/><text x="61" y="729" class="head">Local application runtime</text><text x="61" y="754" class="body">Docker Compose: frontend + backend</text><text x="61" y="773" class="body">MongoDB + Redis with named volumes</text><text x="61" y="792" class="body">Loopback-bound local ports</text><rect x="540" y="700" width="420" height="150" rx="14" class="orange"/><text x="556" y="729" class="head">Observability (separate install)</text><text x="556" y="754" class="body">kube-prometheus-stack Helm release</text><text x="556" y="773" class="body">Prometheus + Grafana + node-exporter</text><text x="556" y="792" class="body">kube-state-metrics + Alertmanager</text><text x="556" y="811" class="body">Not managed by this app chart</text><rect x="1035" y="700" width="405" height="150" rx="14" class="dark"/><text x="1051" y="729" class="head">Security boundaries</text><text x="1051" y="754" class="body">Secrets supplied outside Git</text><text x="1051" y="773" class="body">EKS API CIDR allow-list</text><text x="1051" y="792" class="body">Terraform state / plans never commit</text><text x="1051" y="811" class="body">Review scans before release</text><path d="M875,260 L875,365" class="line dash"/><path d="M1240,290 L1240,365" class="line dash"/><path d="M750,620 L750,700" class="line dash"/><text x="45" y="895" class="small">Runtime status: AWS deployment was torn down after validation and screenshot capture. Diagram shows the reproducible design, not a live environment.</text></svg>